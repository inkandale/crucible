image:
  repository: ghcr.io/inkandale/crucible
  # Empty means .Chart.AppVersion.
  tag: ""

# The Hugging Face model repo and the bundle tag to serve. A new model version is a new revision here.
model: dgibbons/crucible
revision: "v2"

# An 8k-token card peaks at 11.4 GB: the global attention layers hold full tokens-by-tokens matrices.
resources:
  requests:
    cpu: 4
    memory: 12Gi
  limits:
    memory: 14Gi
# onnxruntime threads; on node03's i5-12600H, 4-8 run twice as fast as one per core.
threads: 8
