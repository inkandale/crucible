image:
  repository: ghcr.io/inkandale/crucible
  # Empty means .Chart.AppVersion.
  tag: ""

# The Hugging Face model repo and the bundle tag to serve. A new model version is a new revision here.
model: dgibbons/crucible
revision: "v2"

# An 8k-token card peaks at about 4.2 GB: the global attention layers hold full token-by-token matrices.
resources:
  requests:
    cpu: 1
    memory: 4.5Gi
  limits:
    memory: 6Gi
