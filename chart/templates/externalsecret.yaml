# A Hugging Face read token for the model repo, from the crucible-hf item in the kubernetes vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crucible-hf
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crucible-hf
  data:
    - secretKey: credential
      remoteRef:
        key: crucible-hf
        property: credential
