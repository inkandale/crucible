# The Hugging Face token for the model repo: the apiKey field of the hf-token-rw item in the kubernetes vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crucible-hf
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crucible-hf
  data:
    - secretKey: credential
      remoteRef:
        key: hf-token-rw
        property: apiKey
