apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: crucible
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - { name: CRUCIBLE_MODEL, value: {{ .Values.model | quote }} }
            - { name: CRUCIBLE_REVISION, value: {{ .Values.revision | quote }} }
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: crucible-hf, key: credential } }
          ports:
            - { name: http, containerPort: 8080 }
          # The bundle downloads and passes its fixture check before /healthz answers; allow 10 minutes.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            # A long score holds every core, which can slow /healthz.
            timeoutSeconds: 10
            failureThreshold: 6
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /cache }
      volumes:
        - name: cache
          emptyDir: {}
